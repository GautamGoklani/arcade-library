<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vector Arena</title>
<style>
  /* ---------------------------------------------------------------------
     Fitting the arena to the window.

     The canvas has a fixed 900x600 *drawing buffer* — the engine's world is
     900x600 units and every coordinate it writes into linear memory is in that
     space, so the buffer must not change. What can change is the CSS box the
     browser scales that buffer into.

     This page used to set `overflow: hidden` and `height: 100%` and then place
     an unconstrained 900x600 canvas inside, which meant that on any window
     shorter than about 700px — most laptops with a browser toolbar — the
     bottom of the arena was simply cut off, with no scrollbar to reveal it.

     The fix is one rule: cap the canvas width by *both* the available width and
     the available height, converting the latter through the 3:2 aspect ratio.
     `--chrome` is the vertical space the HUD, the help line and the padding
     take, so the arena gets whatever is left.
     ------------------------------------------------------------------- */
  :root {
    --chrome: 8.5rem;    /* HUD + help + page padding */
    --pad: clamp(0.75rem, 2.5vw, 1.5rem);
  }

  html, body {
    margin: 0;
    min-height: 100%;
    background: #05070d;
    font-family: 'Courier New', monospace;
    color: #cfe8ff;
  }

  #wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    min-height: 100dvh;
    padding: var(--pad);
    box-sizing: border-box;
  }

  #hud {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: clamp(12px, 3vw, 28px);
    padding: 8px 18px;
    background: #0b1220; border: 1px solid #1e3a5f; border-radius: 6px;
    font-size: clamp(12px, 2.4vw, 15px); letter-spacing: 1px;
  }
  #hud span b { color: #6cf0ff; }

  #stage {
    position: relative;
    /* min() of: the container's width, the arena's native width, and the width
       implied by the height still available. 1.5 is 900/600. */
    width: min(100%, 900px, calc((100dvh - var(--chrome)) * 1.5));
  }

  canvas {
    background: radial-gradient(ellipse at center, #0a1428 0%, #050810 100%);
    border: 2px solid #2a4a6f; border-radius: 4px;
    box-shadow: 0 0 40px rgba(60,160,255,0.15);
    display: block;
    width: 100%;
    height: auto;
    /* Reserves the right box before the canvas has been laid out, so the page
       does not reflow once the engine starts drawing. */
    aspect-ratio: 3 / 2;
    box-sizing: border-box;
  }

  #msg {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    font-size: clamp(22px, 5vw, 34px); color: #ff5b6a; text-shadow: 0 0 12px #ff5b6a;
    display: none; text-align: center; width: 100%;
  }
  #msg small { display: block; font-size: clamp(12px, 2.4vw, 15px); color: #cfe8ff; margin-top: 10px; }

  #help {
    font-size: clamp(10px, 2vw, 12px); color: #6f8bab;
    text-align: center; text-wrap: balance;
  }

  /* Very short windows: drop the decorative chrome allowance rather than
     shrinking the arena to a postage stamp. */
  @media (max-height: 30rem) {
    :root { --chrome: 5.5rem; }
    #help { display: none; }
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <span>SCORE: <b id="hudScore">0</b></span>
    <span>LIVES: <b id="hudLives">3</b></span>
    <span>BOTS: <b id="hudBots">0</b></span>
  </div>
  <div id="stage">
    <canvas id="c" width="900" height="600"></canvas>
    <div id="msg">GAME OVER<small>Press R to restart</small></div>
  </div>
  <div id="help">W: thrust &nbsp; A/D: rotate &nbsp; SPACE: fire &nbsp; R: restart</div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hudScore = document.getElementById('hudScore');
const hudLives = document.getElementById('hudLives');
const hudBots = document.getElementById('hudBots');
const msgEl = document.getElementById('msg');

const NUM_BOTS = 6;

// memory layout constants (must match game.wat)
const PLAYER_OFF = 0;
const BOTS_OFF = 24, BOT_STRIDE = 32, MAX_BOTS = 8;
const BULLETS_OFF = 280, BULLET_STRIDE = 24, MAX_BULLETS = 80;

let wasm = null, mem = null, f32 = null;
let running = false;

const input = { left: false, right: false, thrust: false, fire: false };

window.addEventListener('keydown', e => {
  if (e.key === 'a' || e.key === 'ArrowLeft') input.left = true;
  if (e.key === 'd' || e.key === 'ArrowRight') input.right = true;
  if (e.key === 'w' || e.key === 'ArrowUp') input.thrust = true;
  if (e.key === ' ') { input.fire = true; e.preventDefault(); }
  if (e.key === 'r' || e.key === 'R') restart();
});
window.addEventListener('keyup', e => {
  if (e.key === 'a' || e.key === 'ArrowLeft') input.left = false;
  if (e.key === 'd' || e.key === 'ArrowRight') input.right = false;
  if (e.key === 'w' || e.key === 'ArrowUp') input.thrust = false;
  if (e.key === ' ') input.fire = false;
});

function restart() {
  wasm.exports.init(NUM_BOTS);
  msgEl.style.display = 'none';
  running = true;
}

const WASM_B64 = "AGFzbQEAAAABLwlgAX0BfWABfwF/YAABfWACfX0BfWAFf319fX0AYAF/AGADfX9/AGAAAX9gAX0AAhcCA2VudgRzaW5mAAADZW52BGNvc2YAAAMODQEBAgMDBAUGAgIHBwgFAwEAAQbRAR5/AEEIC38AQdAAC38AQRgLfwBBIAt/AEGYAgt/AEEYC38AQZgRC38AQZwRC30AQwAAYUQLfQBDAAAWRAt9AEPbD0lAC30AQwAAgEALfQBDAAC+Qwt9AEOamRk/C30AQwAAgkMLfQBDAAACRAt9AEOuR2E+C30AQwAAJUMLfQBDAACWQwt9AEMAAFxDC30AQwAA8EMLfQBDAACAQQt9AEMAAEBCC38BQeXQhSoLfwFBAAt9AUMAAAAAC38BQQALfwFBAAt9AUMAAAAAC38BQQALB14IBm1lbW9yeQIABGluaXQACAlzZXRfaW5wdXQACQlnZXRfc2NvcmUACglnZXRfbGl2ZXMACwxpc19nYW1lX292ZXIADBBib3RzX2FsaXZlX2NvdW50AA0Ec3RlcAAOCtARDQoAIwIgACMDbGoLCgAjBCAAIwVsagszAQF/IxchACAAIABBDXRzIQAgACAAQRF2cyEAIAAgAEEFdHMhACAAJBcgALNDAACAT5ULDQAgABAEIAEgAJOUkgsrAQF9IAAhAiACQwAAAABdBEAgAiABkiECCyACIAFeBEAgAiABkyECCyACC2IBAn9BACEFAkADQCAFIwFODQEgBRADIQYgBioCFEMAAAAAWwRAIAYgATgCACAGIAI4AgQgBiADOAIIIAYgBDgCDCAGIACyOAIQIAZDAACAPzgCFAwCCyAFQQFqIQUMAAsLC/ACAgJ/An0gACQYIxgjAEoEQCMAJBgLQQAkHUMAAAAAJBxBACQaQQAkG0MAAAAAJBlBAEMAAOFDOAIAQQBDAACWQzgCBEEAQwAAAAA4AghBAEMAAAAAOAIMQQBD+Q/JvzgCEEEAQwAAgD84AhQjBkMAAAAAOAIAIwdDAABAQDgCAEEAIQECQANAIAEjAE4NASABEAIhAiABIxhIBEBDAAAAACMKQwAAAECUEAUhA0MAAIJDQwAAyEMQBSEEIAJDAADhQyADEAEgBJSSOAIAIAJDAACWQyADEAAgBJSSOAIEIAJDAAAAADgCCCACQwAAAAA4AgwgAkMAAAAAOAIQIAJDAACAPzgCFCACQ5qZmT5DAADAPxAFOAIYIAIQBEMAAAA/XQR9QwAAgL8FQwAAgD8LOAIcBSACQwAAAAA4AhQLIAFBAWohAQwACwtBACEBAkADQCABIwFODQEgARADQwAAAAA4AhQgAUEBaiEBDAALCwsOACAAJBkgASQaIAIkGwsHACMGKgIACwcAIwcqAgALBAAjHQs7AQJ/QQAhAEEAIQECQANAIAAjAE4NASAAEAIqAhRDAAAAAF4EQCABQQFqIQELIABBAWohAAwACwsgAQuUDAUJfQR/Kn0BfwJ9Ix0EQA8LQQAqAgAhAUEAKgIEIQJBACoCCCEDQQAqAgwhBEEAKgIQIQUgBSMZIwsgAJSUkiEFIxpBAEcEQCAFEAEjDJQhCCAFEAAjDJQhCSADIAggAJSSIQMgBCAJIACUkiEECyADQwAAgD8jDSAAlJOUIQMgBEMAAIA/Iw0gAJSTlCEEIAMgA5QgBCAElJKRIQcgByMOXgRAIAMgB5UjDpQhAyAEIAeVIw6UIQQLIAEgAyAAlJIjCBAGIQEgAiAEIACUkiMJEAYhAiMcIACTJBwjG0EARyMcQwAAAABfcQRAQQAgASACIAUQASMPlCAFEAAjD5QQByMQJBwLQQAgATgCAEEAIAI4AgRBACADOAIIQQAgBDgCDEEAIAU4AhBBACEKAkADQCAKIwBODQEgChACIQwgDCoCFCETIBNDAAAAAF4EQCAMKgIAIQ4gDCoCBCEPIAwqAgghECAMKgIMIREgDCoCGCEUIA function base64ToBytes(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

async function boot() {
  const imports = { env: { sinf: Math.sin, cosf: Math.cos } };
  const bytes = base64ToBytes(WASM_B64);
  const result = await WebAssembly.instantiate(bytes, imports);
  wasm = result.instance;
  f32 = new Float32Array(wasm.exports.memory.buffer);
  restart();
  requestAnimationFrame(loop);
}

function readPlayer() {
  f32 = new Float32Array(wasm.exports.memory.buffer);
  const o = PLAYER_OFF / 4;
  return { x: f32[o], y: f32[o+1], vx: f32[o+2], vy: f32[o+3], heading: f32[o+4], alive: f32[o+5] };
}
function readBot(i) {
  const o = (BOTS_OFF + i * BOT_STRIDE) / 4;
  return { x: f32[o], y: f32[o+1], vx: f32[o+2], vy: f32[o+3], alive: f32[o+5] };
}
function readBullet(i) {
  const o = (BULLETS_OFF + i * BULLET_STRIDE) / 4;
  return { x: f32[o], y: f32[o+1], owner: f32[o+4], active: f32[o+5] };
}

function drawShip(x, y, heading, color, glow) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(heading);
  ctx.shadowColor = glow;
  ctx.shadowBlur = 12;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(16, 0);
  ctx.lineTo(-12, 10);
  ctx.lineTo(-6, 0);
  ctx.lineTo(-12, -10);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawBullet(x, y, color) {
  ctx.save();
  ctx.shadowColor = color;
  ctx.shadowBlur = 8;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

let lastT = performance.now();
function loop(now) {
  const dt = Math.min((now - lastT) / 1000, 0.05);
  lastT = now;

  if (running) {
    const rot = (input.right ? 1 : 0) - (input.left ? 1 : 0);
    wasm.exports.set_input(rot, input.thrust ? 1 : 0, input.fire ? 1 : 0);
    wasm.exports.step(dt);
    f32 = new Float32Array(wasm.exports.memory.buffer);

    if (wasm.exports.is_game_over()) {
      running = false;
      msgEl.style.display = 'block';
    }
  }

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // starfield-ish grid
  ctx.strokeStyle = 'rgba(60,110,160,0.08)';
  for (let gx = 0; gx < canvas.width; gx += 45) { ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,canvas.height); ctx.stroke(); }
  for (let gy = 0; gy < canvas.height; gy += 45) { ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(canvas.width,gy); ctx.stroke(); }

  const p = readPlayer();
  let botsAlive = 0;
  for (let i = 0; i < MAX_BOTS; i++) {
    const b = readBot(i);
    if (b.alive > 0) {
      botsAlive++;
      const bh = Math.atan2(b.vy, b.vx || 0.0001);
      drawShip(b.x, b.y, bh, '#ff5b6a', '#ff5b6a');
    }
  }
  for (let i = 0; i < MAX_BULLETS; i++) {
    const bl = readBullet(i);
    if (bl.active > 0) {
      drawBullet(bl.x, bl.y, bl.owner === 0 ? '#6cf0ff' : '#ffb15b');
    }
  }
  if (p.alive > 0) {
    drawShip(p.x, p.y, p.heading, '#6cf0ff', '#6cf0ff');
  }

  hudScore.textContent = Math.round(wasm.exports.get_score());
  hudLives.textContent = Math.max(0, Math.round(wasm.exports.get_lives()));
  hudBots.textContent = botsAlive;

  requestAnimationFrame(loop);
}

boot();
</script>
</body>
</html>
