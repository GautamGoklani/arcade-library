<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-label="Vector Arena emblem: a cyan fighter breaking away from two red pursuers">
  <defs>
    <radialGradient id="ba-space" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#0a1428"/>
      <stop offset="100%" stop-color="#04060d"/>
    </radialGradient>
    <linearGradient id="ba-hull" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2ad8ff"/>
      <stop offset="100%" stop-color="#9dfcff"/>
    </linearGradient>
    <filter id="ba-glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ba-glow-sm" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="ba-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#3c6ea0" stroke-opacity="0.16" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="480" height="300" fill="url(#ba-space)"/>
  <rect width="480" height="300" fill="url(#ba-grid)"/>
  <rect x="1" y="1" width="478" height="298" fill="none" stroke="#2a4a6f" stroke-width="2" rx="6"/>

  <!-- drifting debris -->
  <g fill="#cfe8ff" opacity="0.35">
    <circle cx="58" cy="52" r="1.6"/>
    <circle cx="132" cy="228" r="1.2"/>
    <circle cx="404" cy="74" r="1.4"/>
    <circle cx="352" cy="246" r="1.1"/>
    <circle cx="212" cy="46" r="1.1"/>
    <circle cx="86" cy="162" r="1.3"/>
  </g>

  <!-- player tracer -->
  <g filter="url(#ba-glow-sm)" fill="#6cf0ff">
    <circle cx="330" cy="118" r="4"/>
    <circle cx="291" cy="129" r="3.4" opacity="0.75"/>
    <circle cx="256" cy="139" r="2.8" opacity="0.45"/>
  </g>
  <!-- return fire -->
  <g filter="url(#ba-glow-sm)" fill="#ffb15b">
    <circle cx="171" cy="206" r="3.4"/>
    <circle cx="204" cy="220" r="2.6" opacity="0.6"/>
  </g>

  <!-- pursuers -->
  <g fill="#ff5b6a" filter="url(#ba-glow)">
    <path d="M16 0 -12 10 -6 0 -12 -10Z" transform="translate(372,96) rotate(196) scale(1.35)"/>
    <path d="M16 0 -12 10 -6 0 -12 -10Z" transform="translate(126,214) rotate(-24) scale(1.15)"/>
  </g>

  <!-- player fighter -->
  <g transform="translate(214,158) rotate(-28)">
    <!-- thrust plume -->
    <path d="M-14 6 -46 0 -14 -6Z" fill="#6cf0ff" opacity="0.5" filter="url(#ba-glow)"/>
    <path d="M16 0 -12 10 -6 0 -12 -10Z" fill="url(#ba-hull)" filter="url(#ba-glow)" transform="scale(2.1)"/>
  </g>
</svg>
