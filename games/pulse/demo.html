<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pulse — demo</title>
<!-- required on mobile so pinch-zoom does not fight the tap zones -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="pulse.css">
<style>
  body {
    margin: 0;
    padding: 24px 12px;
    background: #08060f;
    display: flex;
    justify-content: center;
    font-family: 'Courier New', monospace;
  }
</style>
</head>
<body>

<!-- the widget builds its own HUD, canvas and overlays inside this container -->
<div id="game"></div>

<script src="pulse.js"></script>
<script>
  var game = Pulse.mount('#game');
  // game.restart();  — start a fresh run
  // game.getState(); — { score, shield, groove, multiplier, bpm, level, bar,
  //                      onBeatShots, shots, gameOver }
  // game.destroy();  — stop the loop, remove DOM + all listeners
  //
  // Sound starts on the first keypress or tap: browsers refuse to open an
  // AudioContext outside a user gesture, and in this title the soundtrack is
  // most of the game.
</script>

</body>
</html>
