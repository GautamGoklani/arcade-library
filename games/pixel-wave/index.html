<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>PIXEL WAVE</title>
<link rel="icon" href="logo.svg">
<link rel="stylesheet" href="pixel-wave.css">
<style>
/* -----------------------------------------------------------------------
   Standalone page shell.

   This page used to inline its own copy of pixel-wave.css and pixel-wave.js
   rather than linking them, which made it a build artefact that nothing rebuilt.
   The joystick pass landed in the widget and this page kept the old on-screen
   buttons, because the copy here was a snapshot taken by hand. It now links the
   two files next to it, the way games/grid-breaker/index.html does, so there is
   one source of truth per asset. The engine is still base64 inside
   pixel-wave.js, so this makes no network request at runtime and `file://`
   still works.

   The widget itself is width-driven — it fills its container, which is correct
   when it is embedded in someone else's layout. This page is nothing but the
   game, so here the binding constraint is the window's *height*: at the
   widget's full 1240px the 1200x750 canvas needs about 775px, and on a laptop
   window the bottom of the arena falls below the fold with no scrollbar
   offering to reveal it.

   `--pw-max-width` (see pixel-wave.css) is the widget's hook for exactly this.
   Cap it by the height still available after the HUD and help line, converted
   through the 8:5 aspect ratio.
   --------------------------------------------------------------------- */
html, body { margin: 0; background: #000; min-height: 100%; }

body {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100dvh;
  padding: clamp(0.5rem, 2vw, 1.25rem);
  box-sizing: border-box;
}

.ss-root {
  --chrome: 7.5rem;                                        /* HUD + help + padding */
  --pw-max-width: min(1240px, calc((100dvh - var(--chrome) - var(--bar, 0px)) * 1.6));
}

@media (max-height: 34rem) {
  .ss-root { --chrome: 4.5rem; }
  .ss-help { display: none; }
}
/* -----------------------------------------------------------------------
   The frame: modern around the edges, retro inside them.

   The game keeps every pixel of its own look — the low-res buffer, the
   scanlines, the HUD. What changed is only the page around it, which used to
   be a flat colour with the widget dropped in the middle: a slim bar with the
   way back to the library and a full-screen button, a faint grid on the
   ground (the same hairline texture as the library's card plates), and the
   arena set on it with rounded corners and depth rather than floating
   edge-to-edge. The bar's height is subtracted from the height budget above
   (`--bar`), so the arena still never falls below the fold.

   Copied into each title's page by hand, like everything else the titles
   share — see CONTRIBUTING.md, invariant 1.
   --------------------------------------------------------------------- */
:root { --bar: 3.25rem; }

body {
  flex-direction: column;
  justify-content: flex-start;
  gap: clamp(0.25rem, 1vw, 0.75rem);
  padding-top: 0;
  background-image:
    radial-gradient(ellipse 70% 55% at 50% 40%, rgba(255, 255, 255, 0.045), transparent 70%),
    linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
  background-size: auto, 32px 32px, 32px 32px;
  background-attachment: fixed;
}

#game { margin-block: auto; width: 100%; display: flex; justify-content: center; }

.arcade-bar {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  width: 100%;
  max-width: 1240px;
  height: var(--bar);
  font: 500 0.8125rem/1 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
  color: rgba(244, 242, 237, 0.72);
  box-sizing: border-box;
}
.arcade-bar a,
.arcade-bar button {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  height: 2.125rem;
  padding: 0 0.875rem;
  border: 1px solid rgba(244, 242, 237, 0.14);
  border-radius: 999px;
  background: rgba(244, 242, 237, 0.04);
  color: inherit;
  font: inherit;
  text-decoration: none;
  cursor: pointer;
  -webkit-backdrop-filter: blur(10px);
          backdrop-filter: blur(10px);
  transition: color 220ms cubic-bezier(0.22, 1, 0.36, 1), border-color 220ms cubic-bezier(0.22, 1, 0.36, 1), background 220ms cubic-bezier(0.22, 1, 0.36, 1);
}
.arcade-bar a:hover,
.arcade-bar button:hover { color: #f4f2ed; border-color: rgba(244, 242, 237, 0.32); background: rgba(244, 242, 237, 0.08); }
.arcade-bar a:focus-visible,
.arcade-bar button:focus-visible { outline: 2px solid #2563eb; outline-offset: 3px; }
.arcade-bar .arcade-title {
  margin: 0 auto;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-size: 0.75rem;
  color: rgba(244, 242, 237, 0.9);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.arcade-bar svg { width: 0.95rem; height: 0.95rem; flex-shrink: 0; }
/* The full-screen button is only shown where the API exists (iOS Safari on a
   phone has none for a page), and hidden while already full screen. */
.arcade-bar [data-fs] { display: none; }
.arcade-bar[data-fs-ok='true'] [data-fs] { display: inline-flex; }
@media (max-width: 30rem) {
  .arcade-bar .arcade-label { display: none; }
  .arcade-bar a, .arcade-bar button { padding: 0 0.625rem; }
}

.ss-root {
  border-radius: 14px;
  box-shadow:
    0 0 0 1px rgba(244, 242, 237, 0.08),
    0 24px 60px -24px rgba(0, 0, 0, 0.9);
}
</style>
</head>
<body>

<nav class="arcade-bar" aria-label="Arcade Library">
  <a href="../../" title="Back to the Arcade Library">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M13 8H3M7 4L3 8l4 4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="arcade-label">Library</span>
  </a>
  <p class="arcade-title">Pixel Wave</p>
  <button type="button" data-fs aria-label="Full screen" title="Full screen">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="arcade-label">Full screen</span>
  </button>
</nav>

<div id="game"></div>

<script src="pixel-wave.js"></script>
<!-- Best scores for the hub. Hosting, not game: the widget does not know this
     exists, and if the file is missing — a game folder copied out on its own —
     the game runs exactly as before. See ../../hiscores.js. -->
<script src="../../hiscores.js"></script>
<script>
  var game = PixelWave.mount('#game');
  // One best per difficulty. Normal keeps the plain slug, so a best set before
  // difficulty existed is still Normal's, and the hub card goes on showing it.
  if (window.ArcadeScores) ArcadeScores.watch(function (st) {
    return st.difficulty && st.difficulty !== 'normal' ? 'pixel-wave:' + st.difficulty : 'pixel-wave';
  }, game);
</script>

<!-- The frame's full-screen button. Hosting, like hiscores.js: the widget does
     not know it exists. The whole page goes full screen, not the canvas, so the
     HUD and the controls come along and the height budget above simply grows. -->
<script>
  (function () {
    var bar = document.querySelector('.arcade-bar');
    var btn = bar && bar.querySelector('[data-fs]');
    var root = document.documentElement;
    if (!btn || !(root.requestFullscreen || root.webkitRequestFullscreen)) return;
    bar.setAttribute('data-fs-ok', 'true');
    function isFull() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
    function paint() {
      var label = isFull() ? 'Exit full screen' : 'Full screen';
      btn.setAttribute('aria-label', label);
      btn.title = label;
      btn.querySelector('.arcade-label').textContent = label;
    }
    btn.addEventListener('click', function () {
      if (isFull()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
      btn.blur();   // so Space launches/fires instead of pressing the button again
    });
    document.addEventListener('fullscreenchange', paint);
    document.addEventListener('webkitfullscreenchange', paint);
  })();
</script>

</body>
</html>
